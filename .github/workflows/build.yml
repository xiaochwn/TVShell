name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10 (Chaquopy build Python)
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install required SDK/NDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)"
          [ -n "$SDKMANAGER" ] || { echo "::error::找不到 sdkmanager"; exit 1; }
          yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          ALL="$("$SDKMANAGER" --list 2>/dev/null)" || true
          PLATFORM="$(echo "$ALL" | grep -oE 'platforms;android-37(\.[0-9]+)?' | sort -V | tail -n1 || true)"
          NDK="$(echo "$ALL" | grep -oE 'ndk;27\.2\.12479018' | sort -V | tail -n1 || true)"
          BUILD_TOOLS="$(echo "$ALL" | grep -oE 'build-tools;3[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n1 || true)"
          echo "PLATFORM=$PLATFORM NDK=$NDK BUILD_TOOLS=$BUILD_TOOLS"
          [ -n "$PLATFORM" ] || { echo "::error::仓库里找不到 android-37 平台"; exit 1; }
          [ -n "$NDK" ] || { echo "::error::仓库里找不到 ndk;27.2.12479018"; exit 1; }
          ARGS=("$PLATFORM" "$NDK")
          [ -n "$BUILD_TOOLS" ] && ARGS+=("$BUILD_TOOLS")
          "$SDKMANAGER" "${ARGS[@]}" > /dev/null
          test -d "$SDK_ROOT/platforms/${PLATFORM#platforms;}" || { echo "::error::$PLATFORM 未安装"; exit 1; }
          test -d "$SDK_ROOT/ndk/${NDK#ndk;}" || { echo "::error::$NDK 未安装"; exit 1; }

      - name: chmod gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        id: apk
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/TVShell_debug.apk
          test -f "$APK" || { echo "::error::未找到 $APK"; ls -R app/build/outputs/apk || true; exit 1; }
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -r | head -n1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | head -5
          fi
          echo "size: $(du -h "$APK" | cut -f1)"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: TVShell-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
